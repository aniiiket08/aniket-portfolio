<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3F3F46" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base container with architectural dark platinum rim -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- Monogram AP -->
  <g font-family="'Libre Baskerville', Georgia, serif" font-weight="700" font-size="54" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="central">
    <text x="54" y="64" letter-spacing="-2">AP</text>
  </g>

  <!-- Subtle refined accent dot -->
  <circle cx="89" cy="74" r="4" fill="#E4E4E7" filter="url(#glow)" />
  <circle cx="89" cy="74" r="2.5" fill="#FFFFFF" />
</svg>
